<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Stardogwalker – Professional dog walking management platform serving Cardiff, South Wales. Book walks, track updates, and manage your dog's care online.">
  <title>Stardogwalker – Cardiff Dog Walking</title>

  <!-- Bootstrap 5 (vendored) -->
  <link rel="stylesheet" href="vendor/bootstrap.min.css">

  <!-- Brand styles -->
  <link rel="stylesheet" href="css/style.css">

  <!-- Favicon (emoji-based) -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐾</text></svg>">
</head>
<body>

  <!-- Navbar -->
  <div id="navbar"></div>

  <!-- Toast notifications -->
  <div id="toast-container"></div>

  <!-- Main app content (router renders here) -->
  <main id="app"></main>

  <!-- Shared modal -->
  <div class="modal fade" id="main-modal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modal-title"></h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="modal-body"></div>
        <div class="modal-footer" id="modal-footer"></div>
      </div>
    </div>
  </div>

  <!-- Bootstrap 5 JS (vendored) -->
  <script src="vendor/bootstrap.bundle.min.js"></script>

  <!-- API client -->
  <script src="js/api.js?v=5"></script>

  <!-- Application -->
  <script src="js/app.js?v=5"></script>
</body>
</html>
